<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweets Bot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #ffe0ec, #fff1d6);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(180, 80, 110, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #e6457a, #f08a5d);
      color: #ffffff;
      padding: 18px 22px;
    }
    .chat-header h1 { font-size: 1.3rem; }
    .chat-header p { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fff8fb;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }
    .message.bot {
      align-self: flex-start;
      background: #ffe9f1;
      color: #4a2334;
      border-bottom-left-radius: 4px;
    }
    .message.user {
      align-self: flex-end;
      background: #e6457a;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .message.error { background: #ffe1e1; color: #a01818; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 20px 12px;
      background: #fff8fb;
    }
    .suggestions button {
      border: 1px solid #f3b3c9;
      background: #ffffff;
      color: #c2325f;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .suggestions button:hover { background: #ffe9f1; }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #f5d5e1;
      background: #ffffff;
    }
    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #f0c4d5;
      border-radius: 999px;
      font-size: 0.95rem;
      outline: none;
    }
    .input-area input:focus { border-color: #e6457a; }
    .input-area button {
      background: #e6457a;
      color: #ffffff;
      border: none;
      padding: 0 22px;
      border-radius: 999px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .input-area button:disabled { background: #e9a9bf; cursor: not-allowed; }

    .typing { display: flex; gap: 4px; padding: 4px 0; }
    .typing span {
      width: 8px;
      height: 8px;
      background: #e6457a;
      border-radius: 50%;
      animation: bounce 1s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>🍬 Sweets Bot</h1>
      <p>Ask me anything about sweets, desserts and treats</p>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">
        Hello! I'm Sweets Bot. Ask me about sweet recipes, origins, ingredients and more.
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button>How to make gulab jamun?</button>
      <button>Origin of baklava</button>
      <button>Sugar-free sweet options</button>
      <button>Sweets for festivals</button>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask about sweets..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const suggestions = document.getElementById("suggestions");

    let history = [];

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function formatText(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^\s*[*-]\s+/gm, "• ")
        .replace(/\n/g, "<br>");
    }

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      if (type === "bot") {
        div.innerHTML = formatText(text);
      } else {
        div.textContent = text;
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "message bot";
      div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message) return;

      suggestions.style.display = "none";
      addMessage(message, "user");
      userInput.value = "";
      sendBtn.disabled = true;

      const typing = showTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        typing.remove();

        if (data.reply) {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text: message });
          history.push({ role: "model", text: data.reply });
        } else {
          addMessage(data.error || "Something went wrong.", "bot error");
        }
      } catch (error) {
        typing.remove();
        addMessage("Could not reach the server. Please try again.", "bot error");
      }

      sendBtn.disabled = false;
      userInput.focus();
    }

    sendBtn.addEventListener("click", () => sendMessage(userInput.value));
    userInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage(userInput.value);
    });
    suggestions.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => sendMessage(button.textContent));
    });
  </script>
</body>
</html>
